[project]
name = "anygarden-workspace"
version = "0.1.0"
description = "Anygarden — multi-agent chat platform (monorepo)"
authors = [{ name = "Changyong Um" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/cluster"]

[tool.uv.sources]
anygarden = { workspace = true }

[tool.ruff]
# Resolve ``anygarden`` as first-party whether ruff runs from the repo root
# (``make lint``) or from ``packages/cluster``, so import sorting agrees.
src = ["packages/cluster"]
