[alembic]
script_location = anygarden/db/migrations
# sqlalchemy.url is intentionally unset (#647).
#
# It used to hardcode sqlite+aiosqlite:///%(here)s/anygarden.db, a file
# the application never opens — so every `alembic` run here migrated a
# phantom database and reported success. env.py now resolves the target
# from, in order: `-x db_url=...`, ANYGARDEN_DB_URL, then this option.
# With all three empty Alembic fails loudly instead of guessing.
#
# Deployments that want a pinned target may uncomment and set it:
# sqlalchemy.url = sqlite+aiosqlite:////var/lib/anygarden/anygarden.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
