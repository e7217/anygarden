[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anygarden-agent"
version = "0.13.0"
description = "Python SDK for Anygarden multi-agent chat"
authors = [{ name = "Changyong Um" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
    "pydantic>=2.6,<3.0",
    "click>=8.1",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
]

[project.scripts]
anygarden-agent = "anygarden_agent.cli:agent_main"
anygarden-client = "anygarden_agent.cli:client_main"

[tool.hatch.build.targets.wheel]
packages = ["anygarden_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
