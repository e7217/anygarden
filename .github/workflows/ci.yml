name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    # A healthy run takes ~12 min. Without a cap a hung test holds the
    # runner for GitHub's 6h default (#726).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up CPython 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      # Test infrastructure only; this is not product federation E2E acceptance.
      - name: Test federation fixture plumbing (Linux, no product E2E)
        run: python3 -m unittest discover -s tests/federation_harness -v

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml

      - name: Check lockfile
        run: uv lock --check

      # Canonical in-memory contract model; not an actual two-node service test.
      - name: Test federation contract reference model (no product E2E)
        run: uv run --no-project contracts/federation/v1/check.py

      - name: Sync workspace
        run: uv sync --frozen --all-packages --all-extras

      - name: Test agent
        working-directory: packages/agent
        run: uv run pytest -x --junitxml=${{ github.workspace }}/junit/agent.xml

      - name: Test cluster
        working-directory: packages/cluster
        # ~2,600 tests; one worker per logical CPU (#753). ``-n auto``
        # counts physical cores when psutil is installed, which gives
        # only 2 workers on the 4-vCPU runner.
        run: uv run pytest -x -n logical --junitxml=${{ github.workspace }}/junit/cluster.xml

      # Requirement IDs travel in the JUnit files (``@pytest.mark.req``);
      # the ``requirements`` job joins them with the frontend results.
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-python
          path: junit/
          if-no-files-found: ignore

  test-windows:
    name: Test (Windows native)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up CPython 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml

      - name: Check lockfile
        run: uv lock --check

      - name: Sync workspace
        run: uv sync --frozen --all-packages --all-extras

      # Windows scope is intentionally narrow: only the test files this
      # PR introduces (safefs Windows backend + cross-platform
      # proc_kill). Existing tests across the machine/agent suites
      # carry hardcoded POSIX mode-bit assertions (``st_mode & 0o777
      # == 0o600``) that surface as 0o666 on Windows because Windows
      # ACL state doesn't round-trip through ``stat``. Migrating those
      # to a platform-aware helper is a separate cleanup; until then
      # the broad suite stays on Linux.
      - name: Test safefs Windows backend
        working-directory: packages/cluster
        run: uv run pytest tests/machine/test_safefs_win.py tests/machine/test_proc_kill.py -v

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/cluster/frontend/package-lock.json

      - name: Install
        working-directory: packages/cluster/frontend
        run: npm ci

      - name: Test frontend (Vitest)
        working-directory: packages/cluster/frontend
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=${{ github.workspace }}/junit/vitest.xml

      - name: Install Playwright Chromium
        working-directory: packages/cluster/frontend
        run: npx playwright install --with-deps chromium

      - name: Test frontend browser E2E
        working-directory: packages/cluster/frontend
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/junit/e2e.xml
        run: npm run test:e2e -- --reporter=github,junit

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-frontend
          path: junit/
          if-no-files-found: ignore

      - name: Upload browser E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-artifacts
          path: packages/cluster/frontend/test-results/
          if-no-files-found: ignore

      - name: Build (typecheck + bundle)
        working-directory: packages/cluster/frontend
        run: npm run build

  # Every requirement in docs/requirements.md must be verified by a passing
  # test in the layer it declares (pytest / vitest / e2e), or be declared
  # ``build`` or a known ``gap``. A new requirement without a test, a test
  # tagged with an unknown ID, or a failing tagged test fails this job.
  requirements:
    name: Requirement coverage
    needs: [test-linux, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download JUnit results
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: junit
          merge-multiple: true

      - name: Check requirement coverage
        run: |
          set -o pipefail
          python3 scripts/req_report.py junit/*.xml --spec docs/requirements.md --require-coverage \
            | tee -a "$GITHUB_STEP_SUMMARY"
