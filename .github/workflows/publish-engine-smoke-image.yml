name: Publish Engine Smoke Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/anygarden-engine-smoke
          tags: type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/engine-smoke/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}

      - name: Write immutable image reference
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/anygarden-engine-smoke
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
