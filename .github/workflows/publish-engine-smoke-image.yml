name: Publish Engine Smoke Image

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release-smoke
    steps:
      - uses: actions/checkout@v4

      - name: Verify protected default-branch publisher
        env:
          ANYGARDEN_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/${ANYGARDEN_DEFAULT_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          ENVIRONMENT=$(gh api "repos/${GITHUB_REPOSITORY}/environments/release-smoke")
          RULES=$(jq '.protection_rules | length' <<<"${ENVIRONMENT}")
          CUSTOM_BRANCHES=$(jq -r '.deployment_branch_policy.custom_branch_policies' <<<"${ENVIRONMENT}")
          MAIN_ONLY=$(gh api "repos/${GITHUB_REPOSITORY}/environments/release-smoke/deployment-branch-policies" \
            --jq '[.branch_policies[].name] == ["main"]')
          test "${RULES}" -ge 1
          test "${CUSTOM_BRANCHES}" = "true"
          test "${MAIN_ONLY}" = "true"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/anygarden-engine-smoke
          tags: type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/engine-smoke/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}

      - name: Write immutable image reference
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/anygarden-engine-smoke
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
