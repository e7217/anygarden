name: Release

on:
  push:
    tags:
      - 'anygarden-v*'
      - 'anygarden-machine-v*'
      - 'anygarden-agent-v*'

permissions:
  contents: read
  actions: read

jobs:
  release-gate:
    name: Browser + same-SHA engine gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/cluster/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: packages/cluster/frontend
        run: npm ci

      - name: Test frontend (Vitest)
        working-directory: packages/cluster/frontend
        run: npm test

      - name: Install Playwright Chromium
        working-directory: packages/cluster/frontend
        run: npx playwright install --with-deps chromium

      - name: Test deterministic browser release gate
        working-directory: packages/cluster/frontend
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-evidence-${{ github.sha }}
          path: packages/cluster/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build frontend (typecheck + bundle)
        working-directory: packages/cluster/frontend
        run: npm run build

      - name: Require successful same-SHA protected engine smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXACT_SHA=$(git rev-parse HEAD)
          DEFAULT_BRANCH=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          PASSED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/engine-smoke.yml/runs?event=workflow_dispatch&status=success&head_sha=${EXACT_SHA}&per_page=20" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${EXACT_SHA}\" and .head_branch == \"${DEFAULT_BRANCH}\")] | length")
          if [ "${PASSED}" -lt 1 ]; then
            echo "::error::Release blocked: no successful protected engine smoke exists for exact SHA ${EXACT_SHA}."
            exit 1
          fi

  build-package:
    name: Build ${{ github.ref_name }}
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dist_name: ${{ steps.parse.outputs.dist_name }}
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Format: anygarden-v<ver>, anygarden-machine-v<ver>, anygarden-agent-v<ver>
          DIST_NAME="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          # PyPI distribution name → packages/<dir> mapping. The cluster
          # package publishes as bare `anygarden`; the directory is still
          # packages/cluster/ so the source layout stays stable.
          case "${DIST_NAME}" in
            anygarden)         PKG="cluster" ;;
            anygarden-machine) PKG="machine" ;;
            anygarden-agent)   PKG="agent" ;;
            *)
              echo "::error::Unknown tag prefix: ${DIST_NAME}"
              exit 1
              ;;
          esac
          echo "dist_name=${DIST_NAME}" >> "$GITHUB_OUTPUT"
          echo "package=${PKG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG} -> dist=${DIST_NAME}, package=${PKG}, version=${VERSION}"

      - name: Verify pyproject version matches tag
        working-directory: packages/${{ steps.parse.outputs.package }}
        run: |
          PYPROJECT_VERSION=$(grep -E '^version = ' pyproject.toml | head -n1 | sed -E 's/version = "([^"]+)".*/\1/')
          if [ "$PYPROJECT_VERSION" != "${{ steps.parse.outputs.version }}" ]; then
            echo "::error::Tag version ${{ steps.parse.outputs.version }} does not match pyproject.toml version ${PYPROJECT_VERSION}"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      # #398 — the cluster (`anygarden`) wheel serves the SPA from
      # ``anygarden/static/``, which is a git-ignored vite build artifact.
      # It must be built BEFORE ``uv build`` so hatchling's ``artifacts``
      # rule can pull it into the sdist/wheel. machine/agent releases
      # don't ship a frontend, so this step is cluster-only.
      - name: Setup Node
        if: steps.parse.outputs.dist_name == 'anygarden'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/cluster/frontend/package-lock.json

      - name: Build frontend (SPA static assets)
        if: steps.parse.outputs.dist_name == 'anygarden'
        working-directory: packages/cluster/frontend
        run: |
          npm ci
          npm run build

      - name: Build sdist + wheel
        run: |
          rm -rf dist/
          # uv writes workspace-member artifacts to the workspace root
          # `dist/` regardless of cwd, so run from repo root and select
          # by distribution name.
          uv build --package "${{ steps.parse.outputs.dist_name }}"

      - name: Upload release artifacts
        id: publish_artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ steps.parse.outputs.package }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-package:
    name: Publish ${{ github.ref_name }}
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      # #402 — OIDC token for PyPI Trusted Publishing. ``id-token: write``
      # lets the runner mint a short-lived OIDC token that PyPI exchanges
      # for an upload grant, so no long-lived API token secret is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ needs.build-package.outputs.package }}-${{ github.sha }}
          path: dist/

      - name: Resolve previous tag for same package
        id: prev
        run: |
          DIST_NAME="${{ needs.build-package.outputs.dist_name }}"
          CURRENT="${GITHUB_REF_NAME}"
          PREV=$(git tag --list "${DIST_NAME}-v*" --sort=-version:refname \
            | grep -vx "${CURRENT}" \
            | head -n1 || true)
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"
          if [ -n "${PREV}" ]; then
            echo "Previous ${DIST_NAME} tag: ${PREV}"
          else
            echo "No previous ${DIST_NAME} tag found - this is the first release for the package."
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIST_NAME="${{ needs.build-package.outputs.dist_name }}"
          VERSION="${{ needs.build-package.outputs.version }}"
          PREV_TAG="${{ steps.prev.outputs.tag }}"
          # uv normalizes hyphens to underscores in wheel/sdist
          # filenames (PEP 491/625), so anygarden-machine ships as
          # anygarden_machine-<ver>-*.whl. Translate the distribution
          # name to the filename form before globbing.
          FILE_PREFIX="${DIST_NAME//-/_}"
          ARGS=(
            "${GITHUB_REF_NAME}"
            --title "${DIST_NAME} v${VERSION}"
            --generate-notes
          )
          if [ -n "${PREV_TAG}" ]; then
            ARGS+=(--notes-start-tag "${PREV_TAG}")
          fi
          gh release create "${ARGS[@]}" dist/${FILE_PREFIX}-${VERSION}*

      # #402 — publish the freshly built distribution to PyPI via
      # Trusted Publishing (OIDC). ``dist/`` holds exactly one package's
      # sdist+wheel (uv build --package selected it), so the whole
      # directory is safe to upload. ``skip-existing`` makes re-runs of a
      # tag idempotent instead of failing on an already-published file.
      # Requires a trusted publisher registered on PyPI for each project
      # (owner e7217 / repo anygarden / workflow release.yml).
      # ANY-7 / PR #585 review — the rollout contract recorded in #582 says
      # remote machine daemons must reach the required anygarden-machine
      # version *before or at the same time as* the cluster. Nothing here can
      # see those daemons, but this gate removes the case that makes the
      # unsafe order unavoidable: if the required machine wheel is not on
      # PyPI yet, an operator physically cannot upgrade daemons first, so
      # publishing the cluster would guarantee the fencing mismatch that
      # #581 closed. Fails closed — an unreadable floor, an ambiguous floor,
      # or an unreachable index all block the publish.
      - name: Require the machine floor to be publishable first
        if: needs.build-package.outputs.dist_name == 'anygarden'
        run: |
          set -euo pipefail
          FLOORS=$(grep -oE '"anygarden-machine>=[^"]+"' packages/cluster/pyproject.toml \
            | sed -E 's/.*>=([^"]+)".*/\1/' | sort -u)
          COUNT=$(printf '%s\n' "${FLOORS}" | grep -c . || true)
          if [ "${COUNT}" -ne 1 ]; then
            echo "::error::Release blocked: expected exactly one anygarden-machine floor in packages/cluster/pyproject.toml, found ${COUNT}."
            printf '%s\n' "${FLOORS}"
            exit 1
          fi
          FLOOR="${FLOORS}"
          echo "Required anygarden-machine floor: ${FLOOR}"
          if ! curl -fsSL --retry 3 --max-time 30 \
                 "https://pypi.org/pypi/anygarden-machine/${FLOOR}/json" -o /dev/null; then
            echo "::error::Release blocked: anygarden-machine ${FLOOR} is not published."
            echo "::error::Publish anygarden-machine ${FLOOR} first so operators can upgrade daemons before or with this cluster release. See docs/runbook/release-operations.md."
            exit 1
          fi
          echo "anygarden-machine ${FLOOR} is available; a daemon-first upgrade is possible."

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
